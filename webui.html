<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小汐鲸">
<meta name="mobile-web-app-capable" content="yes">
<title>小汐鲸</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#243040; --txt:#e6edf3;
    --dim:#8b949e; --acc:#4ea1ff; --ok:#3fb950; --warn:#d29922;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--txt);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    display:flex;align-items:center;gap:8px;padding:10px 14px;
    border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5
  }
  header b{font-size:15px;letter-spacing:.4px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
  .dot.on{background:var(--ok)}
  #meta{flex:1;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button{
    background:#21262d;color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:8px 13px;font-size:14px;cursor:pointer
  }
  button:active{background:#2d333b}
  button.primary{background:var(--acc);border-color:var(--acc);color:#06121f;font-weight:600}
  main{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
  .msg{margin:0 0 14px;display:flex;flex-direction:column;gap:5px}
  .msg.user{align-items:flex-end}
  .bubble{
    max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;
    word-break:break-word;font-size:15px
  }
  .user .bubble{background:#1f6feb;color:#fff;border-bottom-right-radius:5px}
  .bot .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
  .tag{font-size:11px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;padding:0 4px}
  .tag span{
    background:#161b22;border:1px solid var(--line);border-radius:6px;padding:1px 7px
  }
  .tag .hit{color:var(--ok);border-color:#20452c}
  .tag .miss{color:var(--warn);border-color:#4a3a12}
  footer{
    border-top:1px solid var(--line);background:var(--panel);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:flex-end
  }
  textarea{
    flex:1;background:#0d1117;color:var(--txt);border:1px solid var(--line);
    border-radius:11px;padding:10px 12px;font:15px/1.45 inherit;resize:none;
    max-height:130px;min-height:44px;outline:none
  }
  textarea:focus{border-color:var(--acc)}
  #setup{
    position:fixed;inset:0;background:rgba(5,8,12,.92);z-index:20;
    display:flex;align-items:center;justify-content:center;padding:20px
  }
  #setup .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:20px;width:100%;max-width:420px
  }
  #setup h2{margin:0 0 6px;font-size:17px}
  #setup p{color:var(--dim);font-size:13px;margin:0 0 14px}
  #setup input{
    width:100%;background:#0d1117;color:var(--txt);border:1px solid var(--line);
    border-radius:10px;padding:12px;font-size:15px;margin-bottom:12px;outline:none
  }
  #setup button{width:100%;padding:12px}
  .hide{display:none!important}
  #setup .card{max-height:86vh;overflow-y:auto}
  #setup hr{border:0;border-top:1px solid var(--line);margin:18px 0}
  #setup h3{font-size:14px;margin:0 0 10px;color:var(--txt)}
  .row{display:flex;gap:8px;margin-top:10px}
  .row input{flex:1;margin-bottom:0}
  .row button{white-space:nowrap;padding:11px 16px;width:auto}
  #modelList{font-size:13px;max-height:150px;overflow-y:auto;border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;background:#0d1117}
  .mitem{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1c2430}
  .mitem:last-child{border-bottom:0}
  .dim{color:var(--dim)}
  #pullLog{margin-top:10px;font-size:12px;color:var(--acc);min-height:16px;word-break:break-all}
  #capsules{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 2px;background:var(--panel);
    border-top:1px solid var(--line);scrollbar-width:none}
  #capsules::-webkit-scrollbar{display:none}
  #capsules:empty{display:none}
  .capsule{flex:none;background:#21262d;border:1px solid var(--line);color:var(--txt);
    border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
  .capsule:active{background:#2d3a4a}
  #store{position:fixed;inset:0;background:rgba(5,8,12,.94);z-index:30;display:flex;
    align-items:center;justify-content:center;padding:16px}
  #store .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:18px;width:100%;max-width:460px;max-height:82vh;overflow-y:auto}
  #store h2{margin:0 0 4px;font-size:17px}
  #store .sub{margin:0 0 14px;font-size:12px;color:var(--dim)}
  .pitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;
    display:flex;justify-content:space-between;gap:10px;align-items:center}
  .pitem h4{margin:0 0 3px;font-size:14px}
  .pitem p{margin:0;font-size:12px;color:var(--dim)}
  .pitem button{padding:7px 12px;font-size:13px;flex:none}
  .pitem button.on{background:#20452c;border-color:#2d6a3f;color:#3fb950}
  #provList .mitem span:last-child{color:var(--warn);cursor:pointer}
  #store .card textarea, #store .card input[type=text]{
    width:100%;background:#0d1117;color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:9px 10px;font:13px/1.4 inherit;margin-top:6px;outline:none;resize:vertical}
  #store .card textarea:focus, #store .card input:focus{border-color:var(--acc)}
  .cfgbox button{background:#21262d;border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:8px;font-size:13px;cursor:pointer}
  .cfgbox button:active{background:#2d333b}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <b>小汐鲸</b>
  <div id="meta">连接中…</div>
  <button id="btnSetup" style="padding:6px 10px;font-size:12px">设置</button>
</header>

<main id="log"></main>

<div id="capsules"></div>
<footer>
  <textarea id="inp" rows="1" placeholder="说点什么…"></textarea>
  <button class="primary" id="send">发送</button>
</footer>

<div id="setup" class="hide">
  <div class="card">
    <h2>连接到电脑</h2>
    <p id="setupHint">填入电脑上启动时打印的接入令牌。地址已经是当前这台服务器。</p>
    <input id="tokInp" placeholder="令牌 (sk-unarmor-…)" autocomplete="off">
    <button class="primary" id="tokSave">连接</button>

    <hr>
    <h3>电脑上的模型</h3>
    <div id="modelList"><span class="dim">打开时自动读取</span></div>
    <div class="row">
      <input id="pullName" placeholder="qwen2.5:7b" autocomplete="off">
      <button class="primary" id="pullBtn">下载</button>
    </div>
    <div id="pullLog"></div>

    <hr>
    <h3>云端模型</h3>
    <div id="provList"><span class="dim">还没有添加</span></div>
    <input id="provName" placeholder="名称，如 DeepSeek" autocomplete="off">
    <input id="provBase" placeholder="接口地址，如 https://api.deepseek.com/v1" autocomplete="off">
    <input id="provModel" placeholder="模型名，如 deepseek-chat" autocomplete="off">
    <input id="provKey" placeholder="API Key" type="password" autocomplete="off">
    <button class="primary" id="provAdd">添加到网关</button>
    <div id="provLog"></div>

    <hr>
    <h3>插件</h3>
    <button id="storeBtn" style="width:100%">打开插件广场</button>
  </div>
</div>

<div id="store" class="hide">
  <div class="card">
    <h2>插件广场</h2>
    <p class="sub">装上之后会出现在输入框上方，点一下就填进输入框</p>
    <div id="storeList"></div>
    <button class="primary" id="storeClose" style="width:100%;margin-top:6px">关闭</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const logEl = $('#log'), inp = $('#inp'), dot = $('#dot'), meta = $('#meta');

function token(){
  const u = new URLSearchParams(location.search).get('token');
  if (u) { localStorage.setItem('unarmor_tok', u); return u; }
  return localStorage.getItem('unarmor_tok') || '';
}
let TOK = token();

function addMsg(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const b = document.createElement('div');
  b.className = 'bubble'; b.textContent = text;
  d.appendChild(b);
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}
function addTag(node, gw){
  if (!gw) return;
  const t = document.createElement('div');
  t.className = 'tag';
  const ok = gw.verdict === 'comply' || gw.verdict === 'hedge_comply';
  t.innerHTML = `<span class="${ok?'hit':'miss'}">${gw.verdict}</span>`
    + `<span>策略 ${gw.strategy}</span><span>${gw.tries} 次</span>`
    + `<span>${gw.elapsed}s</span>`;
  node.appendChild(t);
}

async function info(){
  try{
    const r = await fetch('/api/info');
    const j = await r.json();
    dot.classList.add('on');
    meta.textContent = `${j.model || '未知模型'} · ${j.token_required ? '需令牌' : '开放'}`;
    return j;
  }catch(e){
    dot.classList.remove('on');
    meta.textContent = '未连接';
  }
}

async function send(){
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = 'auto';
  addMsg('user', text);
  const node = addMsg('bot', '…');
  const bubble = node.querySelector('.bubble');
  const t0 = Date.now();
  try{
    const r = await fetch('/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + TOK},
      body: JSON.stringify({model:'auto', messages:[{role:'user', content:text}]})
    });
    const j = await r.json();
    if (!r.ok){
      bubble.textContent = '错误 ' + r.status + '：' + (j.error || JSON.stringify(j));
      return;
    }
    bubble.textContent = j.choices?.[0]?.message?.content || '(空)';
    addTag(node, j.x_gateway ? {...j.x_gateway, elapsed: ((Date.now()-t0)/1000).toFixed(1)} : null);
    logEl.scrollTop = logEl.scrollHeight;
  }catch(e){
    bubble.textContent = '连接失败：' + e.message + '\n检查手机与电脑是否在同一 WiFi。';
  }
}

$('#send').onclick = send;
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
inp.addEventListener('input', () => {
  inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 130) + 'px';
});
async function loadModels(){
  const box = $('#modelList');
  box.innerHTML = '<span class="dim">读取中…</span>';
  try{
    const r = await fetch('/api/models', {headers:{'Authorization':'Bearer ' + TOK}});
    if (r.status === 401){ box.innerHTML = '<span class="dim">令牌不对，先连接</span>'; return; }
    const j = await r.json();
    const ms = j.models || [];
    if (!ms.length){ box.innerHTML = '<span class="dim">上游还没有模型</span>'; return; }
    box.innerHTML = ms.map(m => {
      const gb = m.size ? (m.size / 1073741824).toFixed(1) + ' GB' : '';
      return `<div class="mitem"><span>${m.id}</span><span class="dim">${gb}</span></div>`;
    }).join('');
  }catch(e){ box.textContent = '读取失败：' + e.message; }
}

async function doPull(){
  const name = $('#pullName').value.trim();
  const out = $('#pullLog');
  if (!name){ out.textContent = '先填模型名，比如 qwen2.5:7b'; return; }
  if (!TOK){ out.textContent = '先填令牌'; return; }
  out.textContent = '请求下载 ' + name + '…';
  try{
    const res = await fetch('/api/pull', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + TOK},
      body: JSON.stringify({name})
    });
    if (!res.ok){
      const t = await res.text();
      out.textContent = '失败 ' + res.status + '：' + t.slice(0, 160);
      return;
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', last = '';
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const l of lines){
        if (!l.trim()) continue;
        let d; try { d = JSON.parse(l); } catch(e){ continue; }
        if (d.error){ out.textContent = '错误：' + String(d.error).slice(0,160); return; }
        let msg = d.status || '';
        if (d.total && d.completed != null){
          const pct = (d.completed / d.total * 100).toFixed(1);
          msg += `  ${pct}%  ${(d.completed/1048576).toFixed(0)}/${(d.total/1048576).toFixed(0)} MB`;
        }
        if (msg && msg !== last){ out.textContent = msg; last = msg; }
      }
    }
    out.textContent = '完成：' + name;
    loadModels();
  }catch(e){ out.textContent = '中断：' + e.message; }
}

$('#pullBtn').onclick = doPull;
$('#btnSetup').onclick = () => {
  $('#tokInp').value = TOK;
  $('#setup').classList.remove('hide');
  if (TOK){ loadModels(); loadProviders(); loadPlugins(); }
};
$('#tokSave').onclick = () => {
  TOK = $('#tokInp').value.trim();
  localStorage.setItem('unarmor_tok', TOK);
  $('#setup').classList.add('hide');
  info();
};

(async () => {
  const j = await info();
  if (j && j.token_required && !TOK) $('#setup').classList.remove('hide');
  if (TOK && TOK.startsWith('sk-unarmor') === false && j?.token_required) $('#setup').classList.remove('hide');
})();

// ---------------------------------------------------------------- 云端模型
async function loadProviders(){
  const box = $('#provList');
  try{
    const r = await fetch('/api/providers', {headers:{'Authorization':'Bearer ' + TOK}});
    if (r.status === 401){ box.innerHTML = '<span class="dim">先填令牌</span>'; return; }
    const j = await r.json();
    const rows = j.cloud || [];
    if (!rows.length){ box.innerHTML = '<span class="dim">还没有添加</span>'; return; }
    box.innerHTML = rows.map(pid =>
      `<div class="mitem"><span>${pid.name} · ${pid.model}</span>` +
      `<span data-del="${pid.id}">删除</span></div>`).join('');
    box.querySelectorAll('[data-del]').forEach(el => {
      el.onclick = async () => {
        await fetch('/api/providers/delete', {
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer ' + TOK},
          body: JSON.stringify({id: el.dataset.del})
        });
        loadProviders(); info();
      };
    });
  }catch(e){ box.textContent = '读取失败：' + e.message; }
}

async function addProvider(){
  const name = $('#provName').value.trim();
  const base = $('#provBase').value.trim();
  const model = $('#provModel').value.trim();
  const key = $('#provKey').value.trim();
  const out = $('#provLog');
  if (!base || !model){ out.textContent = '接口地址和模型名必填'; return; }
  if (!TOK){ out.textContent = '先在上面填接入令牌'; return; }
  out.textContent = '正在验证端点…';
  try{
    const r = await fetch('/api/providers', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + TOK},
      body: JSON.stringify({name, base, model, key})
    });
    const j = await r.json();
    if (!r.ok){ out.textContent = '失败：' + (j.error || '').slice(0,140); return; }
    out.textContent = '已添加，现在可以切过去用';
    $('#provKey').value = '';
    loadProviders(); info();
  }catch(e){ out.textContent = '失败：' + e.message; }
}

$('#provAdd').onclick = addProvider;

// ---------------------------------------------------------------- 插件广场
let PLUGINS = [];

function catLabel(c){ return c === 'channel' ? '渠道' : '增强'; }

async function loadPlugins(){
  try{
    const r = await fetch('/api/plugins', {headers:{'Authorization':'Bearer ' + TOK}});
    if (r.status === 401){ PLUGINS = []; renderPluginBar(); return; }
    const j = await r.json();
    PLUGINS = j.plugins || [];
  }catch(e){ PLUGINS = []; }
  renderPluginBar();
}

function renderPluginBar(){
  const bar = $('#capsules');
  const on = PLUGINS.filter(p => p.enabled);
  if (!on.length){ bar.innerHTML = ''; return; }
  bar.innerHTML = on.map(p => `<button class="capsule" data-open="1">${p.name}</button>`).join('');
  bar.querySelectorAll('[data-open]').forEach(el => {
    el.onclick = () => { renderStore(); $('#store').classList.remove('hide'); };
  });
}

async function togglePlugin(id, enabled, btn){
  btn.disabled = true;
  try{
    const r = await fetch('/api/plugins/toggle', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + TOK},
      body: JSON.stringify({id, enabled})
    });
    const j = await r.json();
    if (!r.ok){ alert(j.error || '切换失败'); return; }
    PLUGINS = j.plugins;
    renderStore(); renderPluginBar();
  }catch(e){ alert('失败：' + e.message); }
  finally{ btn.disabled = false; }
}

async function savePluginConfig(id, config, out){
  try{
    const r = await fetch('/api/plugins/config', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + TOK},
      body: JSON.stringify({id, config})
    });
    const j = await r.json();
    PLUGINS = j.plugins || PLUGINS;
    if (out) out.textContent = '已保存';
  }catch(e){ if (out) out.textContent = '保存失败：' + e.message; }
}

function configFields(p){
  const c = p.config || {};
  if (p.id === 'system-prompt'){
    return `<textarea data-cfg="prompt" rows="2" placeholder="例如：回答一律用中文，只给结论">${c.prompt || ''}</textarea>`;
  }
  if (p.id === 'param-override'){
    return `<div class="row" style="margin-top:8px">
      <input data-cfg="max_tokens" placeholder="max_tokens 上限" value="${c.max_tokens || ''}">
      <label style="font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px">
        <input type="checkbox" data-cfg="drop_temperature" ${c.drop_temperature ? 'checked' : ''}
          style="width:auto;margin:0"> 丢温度
      </label></div>`;
  }
  if (p.id === 'model-filter'){
    return `<input data-cfg="hide" placeholder="隐藏含这些词的模型，逗号分隔" value="${c.hide || ''}">`;
  }
  return '';
}

function renderStore(){
  const box = $('#storeList');
  if (!PLUGINS.length){ box.innerHTML = '<p class="sub">先在上面填接入令牌</p>'; return; }
  const groups = {channel: [], enhancement: []};
  PLUGINS.forEach(p => (groups[p.cat] || groups.enhancement).push(p));

  box.innerHTML = ['channel','enhancement'].map(cat => {
    const rows = groups[cat];
    if (!rows.length) return '';
    return `<h3 style="font-size:13px;color:var(--dim);margin:14px 0 8px">${catLabel(cat)} · ${rows.length}</h3>` +
      rows.map(p => {
        const cfg = p.ready ? configFields(p) : '';
        return `<div class="pitem" style="flex-direction:column;align-items:stretch">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
            <div><h4>${p.name}${p.ready ? '' : ' <span style="color:var(--warn);font-size:11px">未接入</span>'}</h4>
              <p>${p.desc}</p></div>
            <button data-t="${p.id}" class="${p.enabled ? 'on' : ''}"
              ${p.ready ? '' : 'disabled style="opacity:.4"'}>${p.enabled ? '已启用' : '启用'}</button>
          </div>
          ${cfg ? `<div class="cfgbox" style="margin-top:8px">${cfg}
            <button data-s="${p.id}" style="width:100%;margin-top:8px;font-size:13px">保存设置</button></div>` : ''}
        </div>`;
      }).join('');
  }).join('');

  box.querySelectorAll('[data-t]').forEach(el => {
    el.onclick = () => {
      const p = PLUGINS.find(x => x.id === el.dataset.t);
      togglePlugin(p.id, !p.enabled, el);
    };
  });
  box.querySelectorAll('[data-s]').forEach(el => {
    el.onclick = () => {
      const card = el.closest('.pitem');
      const cfg = {};
      card.querySelectorAll('[data-cfg]').forEach(f => {
        cfg[f.dataset.cfg] = f.type === 'checkbox' ? f.checked : f.value;
      });
      savePluginConfig(el.dataset.s, cfg, el);
    };
  });
}

$('#storeBtn').onclick = async () => { await loadPlugins(); renderStore(); $('#store').classList.remove('hide'); };
$('#storeClose').onclick = () => $('#store').classList.add('hide');

// 首次渲染
loadPlugins();

// 注册离线壳，装到桌面后可以全屏打开
if ('serviceWorker' in navigator) {
